name: QA S24 Mother Deployment Script (No Device / No Install)

on:
  pull_request:
    paths:
      - 'scripts/qa/kelpie-s24-mother-deploy.ps1'
      - 'scripts/qa/kelpie-s24-mothernext-18463.ps1'
      - 'scripts/qa/tests/test_mothernext_gates.ps1'
      - '.github/workflows/qa-r5-mother-sidecar.yml'
      - '.github/workflows/qa-r5-mother-deploy-script.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-parse-and-gates:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: PowerShell syntax, flow and safety gate review
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'scripts/qa/kelpie-s24-mother-deploy.ps1'
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_ }
            throw 'PowerShell deployment script must parse without errors.'
          }
          $source = Get-Content -LiteralPath $path -Raw
          foreach ($needle in @(
            "com.kelpie.browser.r5motherverify",
            "com.kelpie.browser.r5betaverify",
            "VerifiedApk",
            "new_pairing_verified",
            "remote_tabs_and_screenshot_pass",
            "background_features_pass",
            "physical_25_cycles_pass",
            "owner_approves_old_package_deletion",
            "Read-Host",
            "adb"
          )) {
            if (-not $source.Contains($needle)) { throw "Missing expected acceptance or provenance marker: $needle" }
          }
          if ($source -match '(?im)^\s*(?:(?:&\s*)?adb\s+uninstall|Remove-Item\s+-Recurse)') {
            throw 'Disallowed unconditional removal detected.'
          }
          $next='scripts/qa/kelpie-s24-mothernext-18463.ps1'
          $nextTokens=$null
          $nextErrors=$null
          $nextAst=[System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $next),[ref]$nextTokens,[ref]$nextErrors)
          if ($nextErrors.Count -gt 0) {
            $nextErrors | ForEach-Object { Write-Error $_ }
            throw '18463 preflight script must parse without errors.'
          }
          $newSource=Get-Content -LiteralPath $next -Raw
          foreach ($marker in @(
            "com.kelpie.browser.r5mothernextverify",
            "SIGNER_MISMATCH",
            "OwnerAuthorizesInstall",
            "OwnerBackupConfirmed",
            "expectedApkHash",
            "expectedCert",
            "PREFLIGHT_READY",
            "INSTALLED_PENDING_ACCEPTANCE",
            "POST_INSTALL_ACCEPTANCE_PASS",
            "Assert-PostInstallEvidence",
            "POST_INSTALL_CANDIDATE_NOT_INSTALLED",
            "Get-FileHash",
            "ApkSigner",
            "versionCode",
            "ReviewedManifestSha256",
            "ReviewedEvidenceSha256",
            "COLD_RESTORE_NOT_PROVEN",
            "ROLLBACK_NOT_PROVEN",
            "CI_NOT_GREEN",
            "EXISTING_SINGLE_APK_REQUIRED_NO_PARALLEL_INSTALL",
            "BETA_INSTALL_NO_GO"
          )) {
            if (-not $newSource.Contains($marker)) { throw "MotherNext safety requirement missing: $marker" }
          }
          $installAt=$newSource.IndexOf("ADB @('install'")
          $certAt=$newSource.IndexOf("SIGNER_MISMATCH")
          if ($installAt -lt 0 -or $certAt -lt 0 -or $certAt -ge $installAt) {
            throw 'Install must be after the installed signing certificate comparison.'
          }
          if ($newSource -match '(?im)^\s*(?:&\s*)?adb\s+uninstall|\bpm\s+clear\b') {
            throw 'MotherNext must never uninstall or clear app data.'
          }
          Write-Host 'PASS: original deployment and 18463 signer/backup gates parse correctly.'
      - name: Exercise preinstall safety, owner authorization and read-only postinstall acceptance
        shell: pwsh
        run: ./scripts/qa/tests/test_mothernext_gates.ps1
