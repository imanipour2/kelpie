name: Lint

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Keep only the newest CI result for each active PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check embedding boundary
        run: pnpm check:embedding

      - name: Check Mac signing plan
        run: pnpm check:macos-signing

      - name: Check app update publication
        run: pnpm check:updates

      - name: Run lint
        run: pnpm lint
