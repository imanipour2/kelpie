name: Generate Kotlin formatting patch for private capture review

on:
  pull_request:
    paths:
      - 'core/android/**'
      - 'apps/android/**'
      - '.github/workflows/qa-capture-format-patch.yml'
  workflow_dispatch:

# Cancel obsolete builds of the same PR instead of flooding Maven Central.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.3
      # Share dependency caches with Android CI to reduce Maven Central 429s.
      # Dependencies and Gradle scripts remain pinned by the existing lockfiles.
      - name: Cache Gradle dependencies
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('core/android/**/*.gradle*', 'apps/android/**/*.gradle*', 'apps/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Format Kotlin without changing repository
        working-directory: apps/android
        run: ./gradlew --no-daemon :kelpie-browser:ktlintFormat :app:ktlintFormat
      - name: Capture reviewed formatting diff
        shell: bash
        run: |
          git diff --binary -- apps/android core/android > /tmp/capture-ktlint.patch
          if [ ! -s /tmp/capture-ktlint.patch ]; then
            echo "No format modifications"
            echo "NO_FORMAT_DIFF" > /tmp/capture-ktlint.patch
          fi
          wc -l /tmp/capture-ktlint.patch
          cp /tmp/capture-ktlint.patch capture-ktlint.patch
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: capture-ktlint-patch-${{ github.sha }}
          path: capture-ktlint.patch
          retention-days: 7
          if-no-files-found: error
