name: S24 Android API36 isolated device QA

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'core/android/**'
      - '.github/workflows/qa-android-api36.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android API36 isolated package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v6.0.3

      - uses: ./.github/actions/browser-contract

      - name: Set up Java 17
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4.0.3

      - name: Install API36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build isolated debug QA profile and run tests
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon \
            -PkelpieApi36VerificationProfile=true \
            :kelpie-browser:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug

      - name: Verify identity, API level, ELF alignment, APK signature and SHA256
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.kelpie.browser.api36verify'"
          "$AAPT" dump badging "$APK" | grep -F "targetSdkVersion:'36'"
          "$ZIPALIGN" -c -P 16 4 "$APK"
          python3 scripts/testing/android-elf-page-check.py "$APK"
          "$SIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload QA artifact (not release signed)
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kelpie-api36-qa-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
