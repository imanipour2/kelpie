name: S24 Unified Preview APK (Build Only)

on:
  push:
    branches:
      - qa/s24-unified-preview-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/browser-contract
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.3
      - name: Compile isolated app only (not a test release)
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:assembleDebug -PkelpieUnifiedVerificationProfile=true
      - name: Audit signed debug APK identity and native layout
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/testing/check_android_16kb_apk.py "$APK"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$ZIPALIGN" && test -n "$AAPT"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.kelpie.browser.unifiedverify'"
          sha256sum "$APK" | tee apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Publish temporary debug preview for owner-device QA only
        uses: actions/upload-artifact@v4
        with:
          name: kelpie-s24-unified-preview-unverified-tests
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7
