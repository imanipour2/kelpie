name: QA R5 Upstream Connection Baseline (No Auto Install)

on:
  pull_request:
    paths:
      - 'apps/android/**'
      - 'core/android/**'
      - '.github/workflows/qa-r5-upstream-connection.yml'
      - 'docs/qa/EF-OPS-KELPIE-UPSTREAM-CONNECTION-BASELINE-20261118.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-upstream-connection-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/browser-contract
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.3
      - name: Install SDK tools
        run: sdkmanager "platforms;android-34" "build-tools;35.0.0"
      - name: Test upstream Ed25519 computer trust, Android Kotlin contract, and isolated APK
        shell: bash
        run: |
          set -euo pipefail
          cmake -S core/native -B /tmp/kelpie-mother-trust -DCMAKE_BUILD_TYPE=Debug -DKELPIE_BUILD_DESKTOP_ENGINES=OFF
          cmake --build /tmp/kelpie-mother-trust --target test_peer_trust --parallel 2
          ctest --test-dir /tmp/kelpie-mother-trust --output-on-failure -R test_peer_trust
          cd apps/android
          ./gradlew --no-daemon -PkelpieR5MotherConnectionQaProfile=true \
            :kelpie-browser:ktlintCheck \
            :kelpie-browser:testDebugUnitTest \
            :app:assembleDebug
      - name: Verify source isolation, app identity, both ports, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGN="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          CORE=core/android/build/generated/source/buildConfig/debug/com/kelpie/browser/BuildConfig.java
          APP=apps/android/app/build/generated/source/buildConfig/debug/com/unlikeotherai/kelpie/app/BuildConfig.java
          test -s "$CORE" && test -s "$APP" && test -s "$APK"
          grep -Eq 'LOCAL_HTTP_PORT[[:space:]]*=[[:space:]]*18462;' "$CORE"
          grep -Eq 'LOCAL_HTTP_PORT[[:space:]]*=[[:space:]]*18462;' "$APP"
          grep -Eq 'R5_NATIVE_CONSENT_QA_ENABLED[[:space:]]*=[[:space:]]*true;' "$APP"
          grep -Eq 'R5_BACKGROUND_AGENT_QA_ENABLED[[:space:]]*=[[:space:]]*true;' "$APP"
          grep -Eq 'PRIVATE_CAPTURE_QA_ENABLED[[:space:]]*=[[:space:]]*false;' "$APP"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.kelpie.browser.r5motherverify'"
          "$AAPT" dump badging "$APK" | grep -F "versionCode='38' versionName='0.2.19-r5-mother-background-qa'"
          "$SIGN" verify --verbose --print-certs "$APK"
          grep -F 'if (!agentConsentQaEnabled) {' core/android/src/main/java/com/kelpie/browser/KelpieBrowserSession.kt
          grep -F '.BrowserGatewayBinding(router, handlerContext)' core/android/src/main/java/com/kelpie/browser/KelpieBrowserSession.kt
          grep -F 'if (!motherMcpR5RendererQaEnabled && r5AgentCoordinator != null)' core/android/src/main/java/com/kelpie/browser/KelpieBrowserSession.kt
          grep -F 'router.motherR5BackgroundQa = motherMcpR5RendererQaEnabled' core/android/src/main/java/com/kelpie/browser/KelpieBrowserSession.kt
          grep -Eq 'R5_MOTHER_MCP_BACKGROUND_QA_ENABLED[[:space:]]*=[[:space:]]*true;' "$APP"
          sha256sum "$APK" > apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          {
            echo "source_commit=$(git rev-parse HEAD)"
            echo "package=com.kelpie.browser.r5motherverify"
            echo "version=0.2.18-r5-mother-connection-qa"
            echo "versionCode=39"
            echo "port=18462"
            echo "connection=UPSTREAM_BROWSER_GATEWAY_WITH_R5_PRIVATE_RENDERER_QA"
            echo "r5_agent_session=OWNER_NATIVE_CONSENT_REQUIRED"
            echo "signature=debug-only"
            echo "install=NO_AUTO_INSTALL_OWNER_READBACK_REQUIRED"
            echo "artifact_sha256=$(sha256sum "$APK" | awk '{print $1}')"
          } > apps/android/app/build/outputs/apk/debug/provenance.txt
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: kelpie-upstream-connect-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/debug/app-debug.apk.sha256
            apps/android/app/build/outputs/apk/debug/provenance.txt
          if-no-files-found: error
          retention-days: 14
