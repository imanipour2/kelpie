name: S24 P3 Compose WebView Ownership QA

on:
  push:
    branches:
      - experiment/s24-p3-compose-owner-qa-20261115
  workflow_dispatch:

concurrency:
  group: s24-p3-compose-owner-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isolated-p3:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: ./.github/actions/browser-contract
      - uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.3
      - name: Enforce exact committed Kotlin formatting for P3 sources
        working-directory: apps/android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :kelpie-browser:ktlintFormat :app:ktlintFormat -PkelpieP3VerificationProfile=true
          git -C ../.. diff --check
          if ! git -C ../.. diff --quiet -- apps/android/app/src/main/java/com/kelpie/browser/P3ComposeQaActivity.kt apps/android/app/src/main/java/com/kelpie/browser/P3ComposeTabHost.kt apps/android/app/src/main/java/com/kelpie/browser/P3EvidenceJournal.kt; then
            git -C ../.. diff -- apps/android/app/src/main/java/com/kelpie/browser/P3ComposeQaActivity.kt apps/android/app/src/main/java/com/kelpie/browser/P3ComposeTabHost.kt apps/android/app/src/main/java/com/kelpie/browser/P3EvidenceJournal.kt
            echo "::error::P3 sources require committed Kotlin formatter changes"
            exit 1
          fi
      - name: Lint, test, and package P3 isolated Compose ownership Android QA
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon \
            :kelpie-browser:ktlintCheck \
            :app:ktlintCheck \
            :kelpie-browser:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            -PkelpieP3VerificationProfile=true
      - name: Verify package identity, aligned native libraries and reproducible hash
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          python3 scripts/testing/check_android_16kb_apk.py "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.kelpie.browser.p3verify'"
          "$AAPT" dump badging "$APK" | grep -F "Kelpie P3 Compose QA"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload verified isolated APK
        uses: actions/upload-artifact@v4
        with:
          name: kelpie-s24-p3-compose-owner-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/debug/*.sha256
          if-no-files-found: error
          retention-days: 7
